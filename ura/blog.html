<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ひとりごと</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
- {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
      background-color: #f7f9f9;
      color: #0f1419;
      line-height: 1.5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      min-height: 100vh;
      border-left: 1px solid #eff3f4;
      border-right: 1px solid #eff3f4;
    }

    .profile-header {
      border-bottom: 1px solid #eff3f4;
    }
    .banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background-color: #cfd9de;
    }
    .profile-info {
      padding: 0 16px 16px 16px;
      position: relative;
    }
    .profile-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      margin-top: -42px;
      object-fit: cover;
      background-color: #ffffff;
      display: block;
    }
    .profile-name {
      font-size: 1.25em;
      font-weight: 800;
      margin: 8px 0 2px 0;
    }
    .profile-bio {
      font-size: 0.9em;
      color: #536471;
      margin: 4px 0 0 0;
    }

    .filter-bar {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 16px;
      border-bottom: 1px solid #eff3f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      font-weight: bold;
    }
    .filter-bar.hidden {
      display: none;
    }
    .clear-btn {
      background-color: #0f1419;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
    }
    .clear-btn:hover {
      background-color: #272c30;
    }

    .tweet-card {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #eff3f4;
      transition: background-color 0.15s;
    }
    .tweet-card:hover {
      background-color: #f7f9f9;
    }
    .tweet-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .tweet-main {
      flex: 1;
      min-width: 0;
    }
    .tweet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eff3f4;
      flex-wrap: wrap;
    }
    .tweet-meta-left {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tweet-author {
      font-weight: 700;
      font-size: 0.95em;
      color: #0f1419;
    }
    .tweet-date {
      font-size: 0.85em;
      color: #536471;
    }
    .labels {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .label {
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 0.75em;
      cursor: pointer;
      font-weight: 600;
    }
    .tweet-body {
      font-size: 0.95em;
      word-wrap: break-word;
    }
    .tweet-body p {
      margin: 0 0 8px 0;
    }
    .tweet-body p:last-child {
      margin-bottom: 0;
    }
    .tweet-body img {
      max-width: 100%;
      height: auto;
      border-radius: 14px;
      border: 1px solid #cfd9de;
      margin-top: 8px;
      display: block;
    }
    .hashtag {
      color: #1d9bf0;
      cursor: pointer;
    }
    .hashtag:hover {
      text-decoration: underline;
    }
    .tweet-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .wave-btn {
      display: inline-block;
      font-size: 0.78em;
      color: #536471;
      text-decoration: none;
      border: 1px solid #cfd9de;
      background-color: #ffffff;
      padding: 4px 12px;
      border-radius: 9999px;
      transition: all 0.15s;
    }
    .wave-btn:hover {
      background-color: #eff3f4;
      color: #0f1419;
    }
    .status-msg {
      padding: 32px 16px;
      text-align: center;
      color: #536471;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="profile-header">
      <img src="https://hic-shi.github.io/info/img/banner.png" alt="ヘッダー画像" class="banner">
      <div class="profile-info">
        <img src="https://pbs.twimg.com/profile_images/2039244132586319872/7BUgugWH_400x400.jpg" alt="アイコン" class="profile-avatar">
        <h1 class="profile-name">ひとりごと</h1>
        <p class="profile-bio">日々のメモとつぶやき置き場</p>
      </div>
    </header>

    <div id="filter-bar" class="filter-bar hidden">
      <span id="filter-status"></span>
      <button class="clear-btn" onclick="clearFilter()">すべて表示</button>
    </div>

    <div id="blog-timeline">
      <div class="status-msg">読み込み中...</div>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'hic-shi';
    const GITHUB_REPO = 'home';
    const AVATAR_URL = 'https://pbs.twimg.com/profile_images/2039244132586319872/7BUgugWH_400x400.jpg';
    const DISPLAY_NAME = 'HIC_SHI';
    const WAVEBOX_URL = 'https://wavebox.me/wave/6luvda7bw2t5fk16/';

    const timelineEl = document.getElementById('blog-timeline');
    const filterBarEl = document.getElementById('filter-bar');
    const filterStatusEl = document.getElementById('filter-status');

    let allPosts = [];

    marked.setOptions({ breaks: true });

    async function fetchPosts() {
      try {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open&per_page=30`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error('データの取得に失敗しました');
        const issues = await response.json();

        allPosts = issues.filter(issue => !issue.pull_request && issue.user.login === GITHUB_USER);
        renderPosts(allPosts);

      } catch (error) {
        console.error(error);
        timelineEl.innerHTML = '<div class="status-msg">読み込みエラーが発生しました。リポジトリがPublicになっているか確認してください。</div>';
      }
    }

    function renderPosts(posts) {
      if (posts.length === 0) {
        timelineEl.innerHTML = '<div class="status-msg">該当する投稿がありません。</div>';
        return;
      }

      timelineEl.innerHTML = posts.map(post => {
        const d = new Date(post.created_at);
        const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

        const labelsHtml = post.labels.length > 0 ? `<div class="labels">` + post.labels.map(label => 
          `<span class="label" onclick="filterByLabel('${label.name}')" style="background-color:#${label.color}22; color:#0f1419; border:1px solid #${label.color};">${label.name}</span>`
        ).join('') + `</div>` : '';

        let bodyHtml = post.body ? marked.parse(post.body) : '';
        bodyHtml = bodyHtml.replace(/(^|\s|>)(#[^\s#<]+)/g, '$1<span class="hashtag" onclick="filterByTag(\'$2\')">$2</span>');

        return `
          <article class="tweet-card">
            <img src="${AVATAR_URL}" alt="" class="tweet-avatar">
            <div class="tweet-main">
              <div class="tweet-header">
                <div class="tweet-meta-left">
                  <span class="tweet-author">${DISPLAY_NAME}</span>
                  <span class="tweet-date">· ${dateStr}</span>
                </div>
                ${labelsHtml}
              </div>
              <div class="tweet-body">
                ${bodyHtml}
              </div>
              <div class="tweet-footer">
                <a href="${WAVEBOX_URL}" target="_blank" rel="noopener noreferrer" class="wave-btn">waveでコメントする</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterByLabel(labelName) {
      const filtered = allPosts.filter(post => post.labels.some(l => l.name === labelName));
      filterStatusEl.textContent = `カテゴリ: ${labelName}`;
      filterBarEl.classList.remove('hidden');
      renderPosts(filtered);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterByTag(tagName) {
      const filtered = allPosts.filter(post => post.body && post.body.includes(tagName));
      filterStatusEl.textContent = `${tagName} の投稿`;
      filterBarEl.classList.remove('hidden');
      renderPosts(filtered);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearFilter() {
      filterBarEl.classList.add('hidden');
      renderPosts(allPosts);
    }

    fetchPosts();
  </script>

</body>
</html>
