        <div class="p-news">
            <h3>News</h3>
            <div id="news-container">読み込み中...</div>
        </div>
<script>
    async function loadNews() {
        const container = document.getElementById('news-container');
        const repo = 'hic-shi/hic-shi.github.io';
        const apiURL = `https://api.github.com/repos/${repo}/contents/news`;

        try {
            const response = await fetch(apiURL);
            if (!response.ok) throw new Error('取得に失敗しました');
            const files = await response.json();

            const mdFiles = files
            .filter(file => file.name.endsWith('.md'))
            .sort((a, b) => b.name.localeCompare(a.name));

            let html = '';
            for (const file of mdFiles) {
                const date = file.name.replace('.md', '').replace(/^20/, '');
                const textRes = await fetch(file.download_url);
                const text = await textRes.text();
                html += `<p>${date} ${text.trim()}</p>`;
            }

            container.innerHTML = html;
        } catch (e) {
            console.error(e);
            container.innerText = 'ニュースを読み込めませんでした。';
        }
    }
loadNews();
</script>
        </div>
