    <div class="copy-container" onclick="copyToClipboard(this, 'AGF')" style="cursor: pointer; position: relative;">
        <img src="https://hic-shi.github.io/AGFos/img/banner.png" alt="AGFos">
        <span class="tooltip">コピーしました！</span>
    </div>
    
    <p>↳画像をクリッしてコードをコピーする</p>

    <script>
        function copyToClipboard(element, type) {
            let textToCopy = '';

            if (type === 'HIC') {
                textToCopy = '<a href="https://hic-shi.github.io/HOME/"><img src="https://hic-shi.github.io/HOME/img/banner.png" alt="HIC_SHI"></a>';
            } else if (type === 'AGF') {
                textToCopy = '<a href="https://hic-shi.github.io/AGFos"><img src="https://hic-shi.github.io/AGFos/banner.png" alt="AGFos"></a>';
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                element.classList.add('show-tooltip');
                setTimeout(() => {
                    element.classList.remove('show-tooltip');
                }, 2000);
            }).catch(err => {
                console.error('コピーに失敗しました', err);
            });
        }
    </script>

    <style>
        .tooltip {
            transition: opacity 0.3s;
        }

        .show-tooltip .tooltip {
            visibility: visible;
            opacity: 1;
        }
    </style>
